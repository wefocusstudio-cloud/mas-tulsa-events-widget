<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Agenda d'activitats de Mas Tulsa." />
    <title>Activitats | Mas Tulsa</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="widget" aria-labelledby="events-title">
      <header class="widget__header">
        <p class="widget__eyebrow">Mas Tulsa</p>
        <h1 id="events-title">Agenda d'activitats</h1>
        <p class="widget__date" data-today></p>
      </header>

      <section class="events" aria-live="polite" aria-busy="true">
        <div class="state state--loading" data-state="loading">
          <span class="loader" aria-hidden="true"></span>
          <p>Carregant activitats...</p>
        </div>

        <div class="state state--empty" data-state="empty" hidden>
          <p>No hi ha activitats programades.</p>
        </div>

        <div class="state state--error" data-state="error" hidden>
          <p>S'ha produït un error en carregar les activitats.</p>
          <small data-error-message></small>
        </div>

        <div class="events__list" data-events-list hidden></div>
      </section>
    </main>

    <script src="/script.js" defer></script>
  </body>
</html>
